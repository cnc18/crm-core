# Configuracion de Alembic (migraciones del esquema de la DB).
# La URL real se inyecta normalmente desde env.py leyendo DATABASE_URL del .env.

[alembic]
# Ubicacion de los scripts de migracion
script_location = migrations

# Plantilla de nombre de archivo para nuevas revisiones
# (incluye fecha para ordenarlas cronologicamente)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Zona horaria para los timestamps de las revisiones (vacio = hora local)
timezone =

# Ruta(s) extra para sys.path, separadas por os.pathsep
prepend_sys_path = .

# URL de la base de datos.
# Se recomienda dejarla vacia aqui y cargarla desde DATABASE_URL en migrations/env.py.
sqlalchemy.url =


[post_write_hooks]
# Hooks opcionales que se ejecutan al generar una migracion (p. ej. black, ruff).
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88 REVISION_SCRIPT_FILENAME


# === Logging ===
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
